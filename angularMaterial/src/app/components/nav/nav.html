<header class="header">
  <h1>My Anular Material Guide</h1>
  <nav>
    <ul>
      <li>
        <!-- relative route -->
        <a routerLink="/">Home</a>
      </li>
    </ul>
    <button (click)="logOut()" [disabled]="isProcessingLoggingOut()">
      @if (isProcessingLoggingOut()) {
        <div class="spinner-wrapper"><mat-spinner diameter="28" strokeWidth="2"></mat-spinner></div>
      } @else {
        Logout
      }
    </button>
  </nav>
</header>
