<h2>Product Componet</h2>
<div class="product-wrapper">
  @for (product of products; track product) {
    <div class="products-list">
      <div class="individual-product">
        <img [src]="`${product.productImagePath}`" alt="product1" />
        <div class="product-details">
          <span>ProductName: {{ product.productName }}</span>
          <span>Price: {{ product.productPrice }}</span>
          <span>Category: {{ product.category }}</span>
          <span>Rating: {{ product.rating }}</span>

          <span>quantity: {{ product.quantity }}</span>
        </div>

        <!-- route params with navigate()methods -->

          >
        </button> -->

        <!-- query parameter with navigate -->
